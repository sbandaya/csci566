<!DOCTYPE html>
<html>

<head>
<title>Title</title>

<script src="https://www.ecst.csuchico.edu/~oal-saadi/Graphics/lib/webgl-utils.js"></script>
<script src="https://www.ecst.csuchico.edu/~oal-saadi/Graphics/lib/webgl-debug.js"></script>
<script src="https://www.ecst.csuchico.edu/~oal-saadi/Graphics/lib/cuon-matrix.js"></script>
<script src="https://www.ecst.csuchico.edu/~oal-saadi/Graphics/lib/cuon-utils.js"></script>

<!-- When page loads, call main() in Javascript. -->
<body onload="main();">

<!-- The Window that displays graphics. -->
<canvas id="webgl" width="1200" height="800"></canvas>
<br> <!-- Newline -->
<div class="slidecontainer">
  <label for="X">Light X</label>
  <input type="range" min="-10" max="10" value="0" step = 0.1 class="slider" id="X">
</div>
<div class="slidecontainer">
  <label for="Y">Light Y</label>
  <input type="range" min="-10" max="10" value="3" step = 0.1 class="slider" id="Y">
</div>
<div class="slidecontainer">
  <label for="Z">Light Z</label>
  <input type="range" min="-10" max="10" value="-3" step = 0.1 class="slider" id="Z">
</div>
<!-- Pressing this button calls function action()" in the
Javascript of the script tag. -->

</body>

<script> 
var VSHADER_SOURCE =
  `attribute vec4 a_Position; 
  attribute vec4 a_Color; 
  attribute vec4 a_Normal; 
  attribute vec2 a_UV; 
  uniform mat4 u_ModelMatrix; 
  uniform mat4 u_ViewMatrix; 
  uniform mat4 u_ProjMatrix;
  varying vec4 v_Position;
  varying vec4 v_Color;
  varying vec3 v_Normal;
  varying vec2 v_UV;
  void main() { 
    gl_Position = u_ProjMatrix * u_ViewMatrix * u_ModelMatrix * a_Position;
    v_Position = u_ModelMatrix * a_Position;
    v_Color = a_Color;

    // Recalculate the normal based on the model matrix and make its length 1 by normalize.
    v_Normal = vec3(u_ModelMatrix * vec4(a_Normal.xyz,0.0));
    v_UV = a_UV;
  }`;

var FSHADER_SOURCE =
  `precision mediump float;
  varying vec4 v_Position; 
  varying vec4 v_Color; 
  varying vec3 v_Normal;
  varying vec2 v_UV;
  uniform float u_Time; 
  uniform vec3 u_lightPos;
  void main() { 

    //Normalize the normal because it is interpolated and not 1.0 in length any more
    vec3 normal = normalize(v_Normal);

    // Calculate dot product of light direction and orientation of a surface (the normal). This gets us "cos(angle)"
    vec3 lightDirection1 = normalize(u_lightPos - v_Position.xyz);
    vec3 lightDirection2 = normalize(vec3(-3.0,2.0,-2.0) - v_Position.xyz);

    float nDotL1 = max(dot(lightDirection1, normal), 0.0);
    float nDotL2 = max(dot(lightDirection2, normal), 0.0);

    // Calculate the color due to diffuse reflection
    vec3 lightColor1 = vec3(1.0, 1.0, 1.0); //White Light Color!
    vec3 diffuse1 = lightColor1 * v_Color.rgb * nDotL1;

    vec3 lightColor2 = vec3(0.1,1.0,0.1); 
    vec3 diffuse2 = lightColor2 * v_Color.rgb * nDotL2;

    // Calculate the color due to ambient reflection
    vec3 ambientColor = vec3(0.2,0.2,0.2);
    vec3 ambient = ambientColor * v_Color.rgb;
    // Add the surface colors due to diffuse reflection and ambient reflection
    gl_FragColor = vec4(diffuse1 + diffuse2 + ambient, v_Color.a);
  }`;

//These are global variables so that the slider oninput function can use them.
var n; 
var gl;

function main() {
  // Set up canvas, WebGL, and shaders.
  var canvas = document.getElementById('webgl');
  gl = getWebGLContext(canvas);
  initShaders(gl, VSHADER_SOURCE, FSHADER_SOURCE);
  gl.clearColor(0.0, 0.0, 0.0, 1);
  //gl.clearColor(0.5, 0.5, 0.5, 1);

  //Additional features of WebGL
  gl.enable(gl.DEPTH_TEST);

  //Matrices
  var modelMatrix = new Matrix4();
  var viewMatrix = new Matrix4();
  var projMatrix = new Matrix4();
  var u_ModelMatrix = gl.getUniformLocation(gl.program,'u_ModelMatrix');
  var u_ViewMatrix = gl.getUniformLocation(gl.program,'u_ViewMatrix');
  var u_ProjMatrix = gl.getUniformLocation(gl.program,'u_ProjMatrix');
 
  //Get time variable in shader.
  var TIME = 0.0;
  var u_Time = gl.getUniformLocation(gl.program, 'u_Time');
  gl.uniform1f(u_Time, 1.0);

  //get lightposition variable in shader
  var u_lightPos = gl.getUniformLocation(gl.program, 'u_lightPos');

  var tick = function(){

    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    //
    var x = parseFloat(document.getElementById('X').value);
    var y = parseFloat(document.getElementById('Y').value);
    var z = parseFloat(document.getElementById('Z').value);
    gl.uniform3f(u_lightPos, x, y, z);

    //Time
    TIME += .3;
    gl.uniform1f(u_Time,TIME)

    //Camera        //Eye x  y   z ,At x y z,Up x y z
    viewMatrix.setLookAt( 0, 2, -5,    0,0,0,   0,1,0);
    gl.uniformMatrix4fv(u_ViewMatrix,false,viewMatrix.elements);

    //Viewing Volume
    projMatrix.setPerspective(30,canvas.width/canvas.height,1,100);
    gl.uniformMatrix4fv(u_ProjMatrix, false, projMatrix.elements);

    ///////Begin Sphere Code////////////////////
        n = initSphere(gl, 50);
        modelMatrix.setTranslate(1,0,0);
        modelMatrix.scale(0.4,0.4,0.4)
        gl.uniformMatrix4fv(u_ModelMatrix,false,modelMatrix.elements);
        gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0);
    ///////End Sphere //////////////////////////

        n = initCylindar(gl, 50);
        modelMatrix.setTranslate(-1,0,0);
        modelMatrix.scale(0.4,0.4,0.4)
        gl.uniformMatrix4fv(u_ModelMatrix,false,modelMatrix.elements);
        gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0);

        n = initCone(gl, 50);
        modelMatrix.setScale(0.4, 0.4, 0.4);
        gl.uniformMatrix4fv(u_ModelMatrix,false,modelMatrix.elements);
        gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0);

    requestAnimationFrame(tick, canvas);
  };
  tick();
}

function initSphere(gl, stacks) {
          
  var SPHERE_DIV = stacks; //Slices will be the same as the stacks.
          
  var i, ai, si, ci;
  var j, aj, sj, cj;
  var p1, p2;
          
  var positions = [];
  var indices = [];
  var colors = [];
  var uvs = [];
          
  // Generate coordinates
  for (j = 0; j <= SPHERE_DIV; j++) {
    aj = j * Math.PI / SPHERE_DIV;
    sj = Math.sin(aj);
    cj = Math.cos(aj);
    for (i = 0; i <= SPHERE_DIV; i++) {
      //Modify somewhere in this loop to change to cone or cylinder!
      ai = i * 2 * Math.PI / SPHERE_DIV;
      si = Math.sin(ai);
      ci = Math.cos(ai);
          
      positions.push(si * sj);  // X
      positions.push(cj);       // Y
      positions.push(ci * sj);  // Z
          
      colors.push(1);
      colors.push(0.3);
      colors.push(0.1); //White material (color) of sphere

      uvs.push(i / SPHERE_DIV); // u in [0,1]
      uvs.push(j / SPHERE_DIV); // v in [0,1]
    }     
  }       
          
  // Generate indices
  for (j = 0; j < SPHERE_DIV; j++) {
    for (i = 0; i < SPHERE_DIV; i++) {
      p1 = j * (SPHERE_DIV+1) + i;
      p2 = p1 + (SPHERE_DIV+1);
          
      indices.push(p1);
      indices.push(p2);
      indices.push(p1 + 1);
          
      indices.push(p1 + 1);
      indices.push(p2);
      indices.push(p2 + 1);
    }     
  }       
          
  // Write the vertex property to buffers (coordinates, normals, colors)
  // Same data can be used for vertex and normal
  initArrayBuffer(gl, 'a_Position', new Float32Array(positions), 3);
  initArrayBuffer(gl, 'a_Normal', new Float32Array(positions), 3);
  initArrayBuffer(gl, 'a_Color', new Float32Array(colors), 3);
  initArrayBuffer(gl, 'a_UV', new Float32Array(uvs), 2);
          
  // Write the indices to the buffer object
  var indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

  // Unbind the buffer object
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
          
  return indices.length;
}         
          
       

function initCylindar(gl, stacks) {
          
  var SPHERE_DIV = stacks; //Slices will be the same as the stacks.
          
  var i, ai, si, ci;
  var j, aj, sj, cj;
  var p1, p2;
          
  var positions = [];
  var indices = [];
  var colors = [];
  var uvs = [];
  var normals = [];
  // Generate coordinates
  for (j = 0; j <= SPHERE_DIV; j++) {
    aj = j * Math.PI / SPHERE_DIV;
    sj = Math.sin(aj);
    cj = Math.cos(aj);
    for (i = 0; i <= SPHERE_DIV; i++) {
      //Modify somewhere in this loop to change to cone or cylinder!
      ai = i * 2 * Math.PI / SPHERE_DIV;
      si = Math.sin(ai);
      ci = Math.cos(ai);
          
      if(j == 0) //top 
      {
        positions.push(0);
        positions.push(1);
        positions.push(0);

        normals.push(0);
        normals.push(1);
        normals.push(0);
      }
      else if(j == SPHERE_DIV) // bottom
      {
        positions.push(0);
        positions.push(-1);
        positions.push(0);

        normals.push(0);
        normals.push(-1);
        normals.push(0);
      }
      else // sides
      {
        positions.push(si);  // X
        positions.push(cj);       // Y
        positions.push(ci);  // Z

        normals.push(si);
        normals.push(0);
        normals.push(ci);
      }

      colors.push(0.8);
      colors.push(0.8);
      colors.push(0.8); 
    
      uvs.push(i / SPHERE_DIV); // u in [0,1]
      uvs.push(j / SPHERE_DIV); // v in [0,1]
    }     
  }       
          
  // Generate indices
  for (j = 0; j < SPHERE_DIV; j++) {
    for (i = 0; i < SPHERE_DIV; i++) {
      p1 = j * (SPHERE_DIV+1) + i;
      p2 = p1 + (SPHERE_DIV+1);
          
      indices.push(p1);
      indices.push(p2);
      indices.push(p1 + 1);
          
      indices.push(p1 + 1);
      indices.push(p2);
      indices.push(p2 + 1);
    }     
  }       
          
  // Write the vertex property to buffers (coordinates, normals, colors)
  // Same data can be used for vertex and normal
  initArrayBuffer(gl, 'a_Position', new Float32Array(positions), 3);
  initArrayBuffer(gl, 'a_Normal', new Float32Array(normals), 3);
  initArrayBuffer(gl, 'a_Color', new Float32Array(colors), 3);
  initArrayBuffer(gl, 'a_UV', new Float32Array(uvs), 2);
          
  // Write the indices to the buffer object
  var indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

  // Unbind the buffer object
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
          
  return indices.length;
}  

function initCone(gl, stacks) {
          
  var SPHERE_DIV = stacks; //Slices will be the same as the stacks.
          
  var i, ai, si, ci;
  var j, aj, sj, cj;
  var p1, p2;
          
  var positions = [];
  var indices = [];
  var colors = [];
  var uvs = [];
  var normals = [];
  // Generate coordinates
  for (j = 0; j <= SPHERE_DIV; j++) {
    aj = j * Math.PI / SPHERE_DIV;
    sj = Math.sin(aj);
    cj = Math.cos(aj);

    for (i = 0; i <= SPHERE_DIV; i++) {
      //Modify somewhere in this loop to change to cone or cylinder!
      ai = i * 2 * Math.PI / SPHERE_DIV;
      si = Math.sin(ai);
      ci = Math.cos(ai);
          
      positions.push(si * (j / SPHERE_DIV));  // X
      positions.push(1 - (j / SPHERE_DIV * 1.5));       // Y
      positions.push(ci * (j / SPHERE_DIV));  // Z
          
      colors.push(0.1);
      colors.push(0.3);
      colors.push(1); 

      normals.push(si);
      normals.push(2/3);
      normals.push(ci);

      uvs.push(i / SPHERE_DIV); // u in [0,1]
      uvs.push(j / SPHERE_DIV); // v in [0,1]
    }     
  }       
          
  // Generate indices
  for (j = 0; j < SPHERE_DIV; j++) {
    for (i = 0; i < SPHERE_DIV; i++) {
      p1 = j * (SPHERE_DIV+1) + i;
      p2 = p1 + (SPHERE_DIV+1);
          
      indices.push(p1);
      indices.push(p2);
      indices.push(p1 + 1);
          
      indices.push(p1 + 1);
      indices.push(p2);
      indices.push(p2 + 1);
    }     
  }       
          
  // Write the vertex property to buffers (coordinates, normals, colors)
  // Same data can be used for vertex and normal
  initArrayBuffer(gl, 'a_Position', new Float32Array(positions), 3);
  initArrayBuffer(gl, 'a_Normal', new Float32Array(normals), 3);
  initArrayBuffer(gl, 'a_Color', new Float32Array(colors), 3);
  initArrayBuffer(gl, 'a_UV', new Float32Array(uvs), 2);
          
  // Write the indices to the buffer object
  var indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

  // Unbind the buffer object
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
          
  return indices.length;
}  

// Handle buffer object creation and enable in shader.
function initArrayBuffer(gl, attribute, data, num) {
  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  var a_attribute = gl.getAttribLocation(gl.program, attribute);
  gl.vertexAttribPointer(a_attribute, num, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(a_attribute);
}

// Update the current slider value (each time you drag the slider handle)
var sliderX = document.getElementById("X");
sliderX.oninput = function() {
  X = parseFloat(this.value);
}

var sliderY = document.getElementById("Y");
sliderY.oninput = function() {
  Y = parseFloat(this.value);
}

var sliderZ = document.getElementById("Z");
sliderZ.oninput = function() {
  Z = parseFloat(this.value);
}

</script>
